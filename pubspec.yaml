name: picell_dock
description: "PiCell floating dock system — reusable panel/tab/split dock engine"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Icons
  phosphor_flutter: ^2.1.0

  # Storage
  path: ^1.9.1

  # Utilities
  collection: ^1.19.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
